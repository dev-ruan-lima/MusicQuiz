<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Music Quiz - teste seus conhecimentos sobre música, artistas, álbuns e muito mais.">

    <title>Music Quiz</title>

</head>

<body>

    <main class="game">

        <section class="screen screen-intro" id="intro-screen">

            <div class="intro-content">

                <div class="logo">
                    <span class="logo-main">music</span>
                    <span class="logo-secondary">quiz</span>
                </div>

                <p class="intro-subtitle">
                    Teste seus conhecimentos musicais
                </p>

                <p class="intro-description">
                    Descubra quantas músicas, artistas e curiosidades
                    você consegue reconhecer.
                </p>

                <button type="button" class="btn btn-primary" id="start-game-btn">
                    Iniciar Jogo
                </button>

            </div>

        </section>

        <section class = "screen screen-config hidden" id="config-screen">
            <div class="config-content">
                <header class="screen-header">
                    <span class="screen-label">
                        configuração
                    </span>
                    <h1>Prepare seu Quiz</h1>
                    <p>Personalize seu desafio antes de começar.</p>
                </header>
                <form id="config-form">
                    <div class="form-group">
                        <label for="player-name">Nome do jogador</label>
                        <input type="text" name="playerName" id="player-name" placeholder="Digite seu nome" autocomplete="name" maxlength="30" required>
                    </div>
                </form>
            </div>
        </section>

    </main>

</body>

</html>
